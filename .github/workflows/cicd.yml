name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  maven-build:
    name: Build, Test and Package
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: fix mvnw permission
        run: chmod +x ./mvnw
      - name: Use Java 8
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
      - name: Verify Java 8
        run: java -version
      - name: Verify Maven
        run: ./mvnw -version
      - name: Compile Application
        run: ./mvnw -B compile
      - name: Run Tests
        run: ./mvnw -B test
      - name: Prepare Legacy npm
        run: |
          mkdir -p .local-npm
          npm pack npm@5.10.0
          tar -xzf npm-5.10.0.tgz -C .local-npm --strip-components=1
          rm -f npm-5.10.0.tgz
          mkdir -p .local-npm/bin
          cat > .local-npm/bin/npm-wrapper <<'EOF'
          #!/bin/sh
          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          PROJECT_ROOT="$(CDPATH= cd -- "$SCRIPT_DIR/../.." && pwd)"
          exec "$PROJECT_ROOT/node/node" "$PROJECT_ROOT/.local-npm/bin/npm-cli.js" "$@"
          EOF
          chmod +x .local-npm/bin/npm-wrapper
          ln -sf npm-wrapper .local-npm/bin/npm
          echo "$PWD/.local-npm/bin" >> "$GITHUB_PATH"
          echo "$PWD/node/yarn/dist/bin" >> "$GITHUB_PATH"
          echo "$PWD/node" >> "$GITHUB_PATH"
          echo "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
      - name: Package WAR
        run: ./mvnw -B package -Pprod -DskipTests
      - name: Verify WAR
        run: ls -lh target/*.war

  sonarqube:
    name: SonarQube Analysis
    needs: maven-build
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: fix mvnw permission
        run: chmod +x ./mvnw
      - name: Use Java 8 for Application Build
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
      - name: Verify Java 8
        run: java -version
      - name: Verify Maven
        run: ./mvnw -version
      - name: Compile Application
        run: ./mvnw -B compile
      - name: Verify Compiled Classes
        run: |
          test -d target/classes
          find target/classes -type f | head -10
      - name: Use Java 17 for SonarQube
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
      - name: Verify Java 17
        run: java -version
      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.organization=harunch13 \
            -Dsonar.projectKey=great-big-example-application

  nexus-deploy:
    name: Deploy WAR to Nexus
    needs: sonarqube
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: fix mvnw permission
        run: chmod +x ./mvnw
      - name: Use Java 8
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
      - name: Verify Java 8
        run: java -version
      - name: Verify Maven
        run: ./mvnw -version
      - name: Create Maven Settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>nexus-releases</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>nexus-snapshots</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Deploy to Nexus
        run: ./mvnw -B deploy -DskipTests

  tomcat:
    name: Docker Tomcat UAT
    needs: nexus-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download Release WAR from Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          curl -fL \
            -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            -o /tmp/great-big-example-application-0.0.1.war \
            http://localhost:9000/repository/maven-releases/org/exampleapps/greatbig/great-big-example-application/0.0.1/great-big-example-application-0.0.1.war
      - name: Verify WAR
        run: ls -lh /tmp/great-big-example-application-0.0.1.war
      - name: Ensure tomcat-sam container exists (Java 8 fix)
        run: |
          if [ "$(docker ps -a -q -f name=^tomcat-sam$)" = "" ]; then
            echo "Creating tomcat-sam with JDK8 image..."
            docker run -d --name tomcat-sam -p 8008:8080 tomcat:9-jdk8
            sleep 10
          else
            echo "Recreating tomcat-sam with JDK8 image to fix JAXB..."
            docker rm -f tomcat-sam || true
            docker run -d --name tomcat-sam -p 8008:8080 tomcat:9-jdk8
            sleep 10
          fi
          docker exec tomcat-sam java -version
          docker ps | grep tomcat-sam
      - name: Remove Previous UAT Deployment
        run: |
          docker exec tomcat-sam rm -rf /usr/local/tomcat/webapps/great-big-example-application-0.0.1 || true
          docker exec tomcat-sam rm -f /usr/local/tomcat/webapps/great-big-example-application-0.0.1.war || true
      - name: Deploy WAR to Docker Tomcat
        run: |
          docker cp /tmp/great-big-example-application-0.0.1.war tomcat-sam:/usr/local/tomcat/webapps/
      - name: Restart Docker Tomcat
        run: |
          docker restart tomcat-sam
          sleep 15
      - name: Verify WAR Deployment
        run: |
          docker exec tomcat-sam ls -lh /usr/local/tomcat/webapps/great-big-example-application-0.0.1.war
      - name: UAT HTTP Test
        run: |
          URL="http://localhost:8008/great-big-example-application-0.0.1/"
          MAX_ATTEMPTS=24
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "UAT attempt $ATTEMPT/$MAX_ATTEMPTS..."
            if curl -fsS "$URL" > /dev/null; then
              echo "UAT PASSED: Application returned HTTP 200."
              exit 0
            fi
            echo "Application not ready yet. Waiting 5 seconds..."
            docker logs tomcat-sam --tail 20 || true
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done
          echo "UAT FAILED: Application did not return HTTP 200 within 120 seconds."
          docker logs tomcat-sam --tail 100 || true
          exit 1

  dockerhub-push:
    name: Build and Push Docker Image
    needs: tomcat
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download Validated WAR from Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mkdir -p target
          curl -fL \
            -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            -o target/great-big-example-application-0.0.1.war \
            http://localhost:9000/repository/maven-releases/org/exampleapps/greatbig/great-big-example-application/0.0.1/great-big-example-application-0.0.1.war
      - name: Verify WAR
        run: ls -lh target/great-big-example-application-0.0.1.war
      - name: Verify Docker
        run: docker --version
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin
      - name: Build Docker Image
        run: docker build -t harunch/great-big-example-application:0.0.1 .
      - name: Push Docker Image
        run: docker push harunch/great-big-example-application:0.0.1
